<article class="cart-item">
  <div class="cart-item__media">
    @if (imageUrl()) {
      <img [src]="imageUrl()" [alt]="name()" class="cart-item__image" loading="lazy" />
    } @else {
      <div class="cart-item__image cart-item__image--placeholder" aria-hidden="true"></div>
    }
  </div>

  <div class="cart-item__body">
    <h3 class="cart-item__name">{{ name() }}</h3>
    <p class="cart-item__price">
      {{ item().price.value | price }} {{ item().price.value.currencyCode }}
    </p>
    <p class="cart-item__line-total">
      Line total: {{ item().totalPrice | price }} {{ item().totalPrice.currencyCode }}
    </p>

    <div class="cart-item__controls">
      <div class="cart-item__quantity" role="group" [attr.aria-label]="'Quantity for ' + name()">
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="s"
          [disabled]="disabled()"
          [attr.aria-label]="'Decrease quantity of ' + name()"
          (click)="decreaseQuantity()"
        >
          −
        </button>
        <span class="cart-item__quantity-value" aria-live="polite">{{ item().quantity }}</span>
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="s"
          [disabled]="disabled()"
          [attr.aria-label]="'Increase quantity of ' + name()"
          (click)="increaseQuantity()"
        >
          +
        </button>
      </div>

      <button
        tuiButton
        type="button"
        appearance="secondary"
        size="s"
        [disabled]="disabled()"
        (click)="onRemove()"
      >
        <tui-icon icon="@tui.trash" />
        Remove
      </button>
    </div>
  </div>
</article>
