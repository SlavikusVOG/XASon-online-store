@if (item(); as item) {
  <article class="cart-item">
    <div class="cart-item__media">
      @if (item.image) {
        <img
          class="cart-item__image"
          [ngSrc]="item.image"
          [alt]="item.name"
          width="120"
          height="90"
        />
      }
    </div>

    <div class="cart-item__details">
      <h2 tuiTitle class="cart-item__name">{{ item.name }}</h2>
      <p class="cart-item__unit-price">
        {{ item.price.value | price | currency: item.price.value.currencyCode }}
        <span class="cart-item__unit-label">each</span>
      </p>
    </div>

    <div class="cart-item__quantity" role="group" [attr.aria-label]="'Quantity for ' + item.name">
      <button
        tuiButton
        type="button"
        appearance="secondary"
        size="xs"
        [disabled]="item.quantity <= 1"
        [attr.aria-label]="'Decrease quantity of ' + item.name"
        (click)="decreaseQuantity()"
      >
        −
      </button>
      <span class="cart-item__quantity-value" aria-live="polite">{{ item.quantity }}</span>
      <button
        tuiButton
        type="button"
        appearance="secondary"
        size="xs"
        [attr.aria-label]="'Increase quantity of ' + item.name"
        (click)="increaseQuantity()"
      >
        +
      </button>
    </div>

    <p class="cart-item__line-total">
      {{ lineTotal() | price | currency: item.price.value.currencyCode }}
    </p>

    <button
      tuiButton
      type="button"
      appearance="flat"
      size="s"
      class="cart-item__remove"
      [attr.aria-label]="'Remove ' + item.name + ' from cart'"
      (click)="removeItem()"
    >
      <tui-icon icon="@tui.trash" />
      Remove
    </button>
  </article>
}
