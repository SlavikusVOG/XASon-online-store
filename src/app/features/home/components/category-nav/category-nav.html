<section class="categories">
  <h2 tuiTitle class="categories__title">Shop by Category</h2>

  <div class="categories__row">
    @for (category of categories(); track category.id) {
      <a
        [routerLink]="[PAGES.CATALOG.link]"
        [queryParams]="{ category: category.slug }"
        class="categories__chip"
        tuiAppearance="floating"
      >
        <span class="categories__chip-icon" [style.background]="category.name | tuiAutoColor">
          {{ category.name | tuiInitials }}
        </span>
        <span class="categories__chip-name">{{ category.name }}</span>
      </a>
    }
  </div>
</section>
