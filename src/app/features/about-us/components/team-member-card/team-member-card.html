@if (member(); as member) {
  <article tuiAppearance="floating" class="team-card">
    @if (member.photo) {
      <img
        tuiAvatar
        [src]="member.photo"
        [alt]="member.name"
        size="xxl"
        [round]="true"
        class="team-card__avatar"
      />
    } @else {
      <span
        tuiAvatar
        size="xxl"
        [round]="true"
        class="team-card__avatar"
        [style.background]="member.name | tuiAutoColor"
      >
        {{ member.name | tuiInitials }}
      </span>
    }

    <div class="team-card__body">
      <h3 tuiTitle class="team-card__name">{{ member.name }}</h3>
      <p class="team-card__role">{{ member.role }}</p>
      <p class="team-card__bio">{{ member.bio }}</p>

      <a
        tuiButton
        appearance="secondary"
        size="s"
        [href]="member.github"
        target="_blank"
        rel="noopener noreferrer"
        class="team-card__github"
      >
        <tui-icon icon="@tui.github" />
        GitHub
      </a>
    </div>
  </article>
}
