@switch (catalogStore.loadStatus()) {
  @case (DATA_LOAD_STATUSES.LOADING) {
    <!-- скелетон -->
  }
  @case (DATA_LOAD_STATUSES.WITH_DATA) {
    @for (product of catalogStore.products(); track product.id) {
      <xas-product-card
        [product]="product"
        (addedToCart)="addToCart($event)"
        (removedFromCart)="removeFromCart($event)"
      />
    }
  }
  @case (DATA_LOAD_STATUSES.NO_DATA) {
    <!-- заглушка "продукты не найдены" -->
  }
  @case (DATA_LOAD_STATUSES.ERROR) {
    <!-- заглушка "ошибка при загрузке" -->
  }
}
