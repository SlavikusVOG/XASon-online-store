<header>
  <div class="wrapper header__container">
    <div class="header__left">
      <a class="header__title" routerLink="/">
        <h1><span class="purple">XAS</span>on</h1>
      </a>

      <!-- я думаю это сделать кнопкой, чтобы при нажатии на неё поднималась модалка -->
      <!-- и было примерно как на каталоге онлайнера -->
      <div class="header__search">
        <tui-icon icon="@tui.search" />
        Search
      </div>
    </div>

    <div class="header__right">
      <a class="header__link" routerLink="/home" routerLinkActive="header__link-active">
        <tui-icon icon="@tui.house" />
        Home
      </a>
      <a class="header__link" routerLink="/catalog" routerLinkActive="header__link-active">
        <tui-icon icon="@tui.package" />
        Catalog
      </a>
      <a class="header__link" routerLink="/about-us" routerLinkActive="header__link-active">
        <tui-icon icon="@tui.users" />
        About us
      </a>

      <div
        class="header__profile"
        [tuiDropdown]="profileDropdown"
        [(tuiDropdownOpen)]="isProfileDropdownOpen"
      >
        <tui-icon icon="@tui.user-round" />
      </div>

      <ng-template #profileDropdown>
        <ng-container *xasAuth="'authenticated'">
          <a class="header__link header__dropdown-item" [routerLink]="PAGES.PROFILE.link">
            <tui-icon icon="@tui.user-round" />
            Account
          </a>
          <a class="header__link header__dropdown-item" [routerLink]="PAGES.CART.link">
            <tui-icon icon="@tui.shopping-cart" />
            Cart
          </a>
        </ng-container>

        <ng-container *xasAuth="'guest'">
          <a class="header__link header__dropdown-item" [routerLink]="PAGES.LOGIN.link">
            <tui-icon icon="@tui.log-in" />
            Sign In
          </a>
          <a class="header__link header__dropdown-item" [routerLink]="PAGES.CART.link">
            <tui-icon icon="@tui.shopping-cart" />
            Cart
          </a>
        </ng-container>
      </ng-template>
    </div>
  </div>
</header>
