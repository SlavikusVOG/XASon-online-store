<p>login-form works!</p>

<div class="container">
  <form>
    <h1>Login</h1>
    <div class="container__body">
      <div class="container__body_item">
        <label for="email">Email</label>
        <input type="email" id="email-input" placeholder="example@example.com" />
        <span class="container__body_item_error">Email not valid</span>
      </div>
      <div class="container__body_item">
        <label for="password">Password</label>
        <input type="password" id="password-input" placeholder="example@example.com" />
        <span class="container__body_item_error">Email not valid</span>
      </div>
      <button type="submit">Login</button>
      <button type="button">Clear</button>
      <p>Don't have an account? <a href="/register">Register</a></p>
    </div>
  </form>
</div>
